services:
  pg:
    image: pgvector/pgvector:pg16
    container_name: ch2398-pg
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须由环境变量提供}
      POSTGRES_DB: ${POSTGRES_DB:-ch2398}
    ports:
      - "55498:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
